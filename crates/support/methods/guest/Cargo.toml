[package]
name = "guests"
version = "0.1.0"
edition = "2021"
resolver = "3"
rust-version = "1.85.0"

[workspace]

[[bin]]
name = "program"
path = "src/bin/program.rs"

[dependencies]
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ['std'] }
e3-compute-provider = { git = "https://github.com/theinterfold/interfold", rev = "c2097da61b4d07c4ce83840393ff4e9f171eefb4" }
e3-support-types = { path = "../../types" }
e3-user-program = { path = "../../program" }
bincode = "=1.3.3"
anyhow = "=1.0.98"

[profile.release]
lto = "thin"
