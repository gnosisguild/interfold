name: contributors

# Lives outside ci.yml because ci.yml only runs on pull_request, where
# github.ref is refs/pull/N/merge — the main-branch guard could never match
# and the job was silently skipped on every run.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contrib-readme-job:
    timeout-minutes: 10
    runs-on: 'ubuntu-latest'
    name: Populate Contributors List
    if: "!contains(github.event.head_commit.message, 'contrib-readme-action')"
    concurrency:
      group: contrib-readme-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribute List
        uses: akhilmhdh/contributors-readme-action@1ff4c56187458b34cd602aee93e897344ce34bfc # v1.4.0
        with:
          image_size: 100
          readme_path: README.md
          use_username: false
          columns_per_row: 6
          collaborators: direct
          commit_message: 'docs(contributor): contrib-readme-action has updated readme'
          committer_username: 'github-actions[bot]'
          committer_email: 'github-actions[bot]@users.noreply.github.com'
          auto_detect_branch_protection: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
