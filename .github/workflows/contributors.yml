name: contributors

# Runs on pull_request rather than push to main. The contributors table lives on
# main, but main is covered by the "Main Protection" ruleset: a direct push is
# rejected, and the PR the action falls back to opening can never merge because
# PRs created with GITHUB_TOKEN do not trigger workflow runs, so the required
# template_integration / crisp_e2e checks never report. Committing to the PR's
# own branch sidesteps both — the table reaches main when the PR merges.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contrib-readme-job:
    timeout-minutes: 10
    runs-on: 'ubuntu-latest'
    name: Populate Contributors List
    # Fork PRs get a read-only GITHUB_TOKEN and no write access to the fork's
    # branch, so the push would fail. Skip them; the list refreshes on the next
    # same-repo PR.
    if: github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: contrib-readme-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The default merge ref is detached; the action needs the real branch
          # to commit back to.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribute List
        uses: akhilmhdh/contributors-readme-action@1ff4c56187458b34cd602aee93e897344ce34bfc # v1.4.0
        with:
          image_size: 100
          readme_path: README.md
          use_username: false
          columns_per_row: 6
          collaborators: direct
          commit_message: 'docs(contributor): contrib-readme-action has updated readme'
          committer_username: 'github-actions[bot]'
          committer_email: 'github-actions[bot]@users.noreply.github.com'
          # PR branches are not covered by the Main Protection ruleset, so push
          # straight to them. Left on, the action would try to open a PR instead.
          auto_detect_branch_protection: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
