name: Release

permissions:
  id-token: write
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*' # Pre-release tags like v1.0.0-beta.1

env:
  CIPHERNODE_DOCKERFILE_PATH: crates/Dockerfile
  SUPPORT_DOCKERFILE_PATH: crates/support/Dockerfile
  CIPHERNODE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ciphernode
  SUPPORT_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/e3-support
  NOIR_TOOLCHAIN: v1.0.0-beta.26
  MNEMONIC: 'test test test test test test test test test test test junk'
  INFURA_API_KEY: 'zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz'
  ETHERSCAN_API_KEY: 'zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz'

jobs:
  validate-and-prepare:
    name: Validate Tag and Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          # Extract version from tag (remove 'v' prefix)
          VERSION=${GITHUB_REF_NAME#v}

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if it's a pre-release (contains -, like beta, alpha, rc, etc.)
          if [[ "$VERSION" =~ - ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "📦 Pre-release version: $VERSION"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "📦 Release version: $VERSION"
          fi

      - name: Verify versions match
        run: |
          VERSION=${{ steps.get_version.outputs.version }}

          # Check Cargo.toml workspace version
          CARGO_VERSION=$(grep -E '^\[workspace\.package\]' -A 5 Cargo.toml | grep '^version' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "❌ Cargo.toml version ($CARGO_VERSION) doesn't match tag ($VERSION)"
            exit 1
          fi

          # Check root package.json if it exists
          if [ -f package.json ]; then
            NPM_VERSION=$(node -p "require('./package.json').version")
            if [ "$NPM_VERSION" != "$VERSION" ]; then
              echo "❌ package.json version ($NPM_VERSION) doesn't match tag ($VERSION)"
              exit 1
            fi
          fi

          echo "✅ All versions match: $VERSION"

  build-ciphernode-image-release:
    name: Build & Push ciphernode (release)
    runs-on: ubuntu-latest
    needs: validate-and-prepare
    env:
      CIPHERNODE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ciphernode
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ciphernode release image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: crates/Dockerfile
          push: true
          tags: |
            ${{ env.CIPHERNODE_IMAGE_NAME }}:${{ needs.validate-and-prepare.outputs.version }}
            ${{ env.CIPHERNODE_IMAGE_NAME }}:latest
          cache-from: |
            type=gha,scope=ciphernode
          cache-to: |
            type=gha,mode=max,scope=ciphernode

  build-e3-support-release:
    name: Build & Push e3-support (release)
    runs-on: ubuntu-latest
    needs: validate-and-prepare
    env:
      SUPPORT_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/e3-support
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push e3-support release image
        uses: docker/build-push-action@v5
        with:
          context: ./crates/support
          file: ${{ env.SUPPORT_DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ env.SUPPORT_IMAGE_NAME }}:${{ needs.validate-and-prepare.outputs.version }}
            ${{ env.SUPPORT_IMAGE_NAME }}:latest
          cache-from: |
            type=gha,scope=e3-support
          cache-to: |
            type=gha,mode=max,scope=e3-support

  build-nix-flake:
    name: Build Nix Flake
    runs-on: ubuntu-latest
    needs: validate-and-prepare
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v15
        with:
          name: interfold
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        # if the following fails it means some of our git dependencies or bb has updated
        # to fix this basically what you need to do here is copy the actual hashes
        # into the flake.nix where those hashes are expected. if you want to do this locally
        # install the nix package manager and try running the scripts below.
      - run: bash ./scripts/nix-versions.sh # display bad versions when deps change
      - run: nix build .#default # build the nix flake

  build-binaries:
    name: Build Binaries (${{ matrix.os_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: validate-and-prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install solc (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo add-apt-repository -y ppa:ethereum/ethereum
          sudo apt-get update
          sudo apt-get install -y solc

      - name: Install solc (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install solidity

      - name: Build interfold binary
        run: cargo build --locked --release --target ${{ matrix.target }} --bin interfold

      - name: Build interfoldup binary
        run: cargo build --locked --release --target ${{ matrix.target }} --bin interfoldup

      - name: Create release archives
        shell: bash
        run: |
          mkdir -p dist

          # Get the correct binary extension
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            EXT=".exe"
          else
            EXT=""
          fi

          # Create interfold archive
          cp "target/${{ matrix.target }}/release/interfold${EXT}" "./interfold${EXT}"
          tar -czf "dist/interfold-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz" "interfold${EXT}"
          rm "interfold${EXT}"

          # Create interfoldup archive
          cp "target/${{ matrix.target }}/release/interfoldup${EXT}" "./interfoldup${EXT}"
          tar -czf "dist/interfoldup-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz" "interfoldup${EXT}"
          rm "interfoldup${EXT}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interfold-binaries-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/

  publish-rust-crates:
    name: Publish Rust Crates
    runs-on: ubuntu-latest
    needs: validate-and-prepare
    continue-on-error: true
    # Publish ALL versions to crates.io (including pre-releases)
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION="${{ needs.validate-and-prepare.outputs.version }}"
          IS_PRERELEASE="${{ needs.validate-and-prepare.outputs.is_prerelease }}"

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "📦 Publishing pre-release version to crates.io: $VERSION"
          else
            echo "📦 Publishing stable version to crates.io: $VERSION"
          fi

          cargo install cargo-workspaces@0.3.6 --locked
          cargo workspaces publish --from-git --yes

  publish-npm-packages:
    name: Publish NPM Packages
    runs-on: ubuntu-latest
    needs: validate-and-prepare
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # `pnpm build:ts` builds the SDK, whose prebuild compiles the threshold
      # circuits via `nargo` (packages/interfold-sdk/scripts/compile-circuits.sh).
      # Without nargo on PATH the build fails with "nargo is not installed".
      - name: Install Nargo
        uses: noir-lang/noirup@v0.1.4
        with:
          toolchain: ${{ env.NOIR_TOOLCHAIN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:ts

      - name: Prepare packages for npm publishing
        run: pnpm prepare-publish

      - name: Determine npm tag
        id: npm_tag
        run: |
          if [[ "${{ needs.validate-and-prepare.outputs.is_prerelease }}" == "true" ]]; then
            echo "tag=next" >> $GITHUB_OUTPUT
            echo "📦 Publishing with 'next' tag for pre-release"
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "📦 Publishing with 'latest' tag for stable release"
          fi

      - name: Publish @interfold/config
        working-directory: packages/interfold-config
        run: npm publish --access public --tag ${{ steps.npm_tag.outputs.tag }} --provenance

      - name: Publish @interfold/contracts
        working-directory: packages/interfold-contracts
        run: npm publish --access public --tag ${{ steps.npm_tag.outputs.tag }} --provenance

      - name: Publish @interfold/wasm
        working-directory: crates/wasm
        run: npm publish --access public --tag ${{ steps.npm_tag.outputs.tag }} --provenance

      - name: Publish @interfold/sdk
        working-directory: packages/interfold-sdk
        run: npm publish --access public --tag ${{ steps.npm_tag.outputs.tag }} --provenance

      - name: Publish @interfold/react
        working-directory: packages/interfold-react
        run: npm publish --access public --tag ${{ steps.npm_tag.outputs.tag }} --provenance

      - name: Publish @interfold/mcp
        working-directory: packages/interfold-mcp
        run: npm publish --access public --tag ${{ steps.npm_tag.outputs.tag }} --provenance

  download-circuits:
    name: Download Circuit Artifacts
    runs-on: ubuntu-latest
    needs: validate-and-prepare
    outputs:
      found: ${{ steps.pull.outputs.found }}
      source_hash: ${{ steps.pull.outputs.source_hash }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Pull circuit artifacts
        id: pull
        run: |
          SOURCE_HASH=$(pnpm tsx scripts/build-circuits.ts hash)
          echo "source_hash=$SOURCE_HASH" >> $GITHUB_OUTPUT

          if git fetch origin circuit-artifacts 2>/dev/null; then
            mkdir -p dist/circuits
            git archive origin/circuit-artifacts | tar -x -C dist/circuits
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      # Guard against shipping stale or wrong-layout artifacts. The `circuit-artifacts`
      # branch is populated out-of-band (`pnpm build:circuits --committee all --preset
      # insecure-512` followed by `scripts/circuit-artifacts.ts push`). If it lags the
      # circuit source, its SOURCE_HASH won't match the source we're releasing and its
      # on-disk layout may predate the `{preset}/{committee}/{variant}` scheme that
      # consumers (e3-zk-prover) resolve against. Fail loudly here rather than publishing
      # a tarball that downstreams can't use — regenerate and re-push the branch.
      - name: Verify circuit artifacts match source
        if: steps.pull.outputs.found == 'true'
        run: |
          PULLED_HASH=$(cat dist/circuits/SOURCE_HASH 2>/dev/null || true)
          EXPECTED_HASH="${{ steps.pull.outputs.source_hash }}"
          if [[ -z "$PULLED_HASH" ]]; then
            echo "::error::circuit-artifacts branch is missing SOURCE_HASH; cannot verify it matches the released source."
            exit 1
          fi
          if [[ "$PULLED_HASH" != "$EXPECTED_HASH" ]]; then
            echo "::error::circuit-artifacts is stale (SOURCE_HASH=$PULLED_HASH, expected $EXPECTED_HASH)."
            echo "::error::Rebuild and re-push: pnpm build:circuits --committee all --preset insecure-512 && pnpm tsx scripts/circuit-artifacts.ts push"
            exit 1
          fi
          # Assert the per-committee layout that `--committee all` produces is present, so an
          # old flat (committee-less) build can never slip through even if the hash lined up.
          missing=0
          for committee in minimum micro small; do
            marker="dist/circuits/insecure-512/${committee}/default/dkg/pk/pk.json"
            if [[ ! -f "$marker" ]]; then
              echo "::error::Expected circuit artifact missing: ${marker#dist/circuits/}"
              missing=1
            fi
          done
          if [[ "$missing" != "0" ]]; then
            echo "::error::circuit-artifacts was not built with --committee all; regenerate as above."
            exit 1
          fi
          echo "✅ circuit-artifacts verified (SOURCE_HASH=$PULLED_HASH, per-committee layout present)"

      - name: Create release archive
        if: steps.pull.outputs.found == 'true'
        run: |
          cd dist
          tar -czvf circuits-${{ needs.validate-and-prepare.outputs.version }}.tar.gz circuits/

      - uses: actions/upload-artifact@v4
        if: steps.pull.outputs.found == 'true'
        with:
          name: noir-circuits
          path: |
            dist/circuits-*.tar.gz
            dist/circuits/SHA256SUMS
            dist/circuits/checksums.json

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      [
        validate-and-prepare,
        build-ciphernode-image-release,
        build-e3-support-release,
        build-binaries,
        publish-rust-crates,
        publish-npm-packages,
        download-circuits,
        build-nix-flake,
      ]
    if: always() && needs.validate-and-prepare.result == 'success' && needs.build-binaries.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # This job holds `contents: write` and runs `pnpm install`, which executes lifecycle
          # scripts from every dependency. Persisting the token in .git/config would leave it on
          # disk for all of them. The one step that needs it takes it explicitly instead.
          persist-credentials: false

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      # Pinned to immutable SHAs: this job has `contents: write` and force-pushes `stable`, so a
      # mutable tag could introduce unreviewed code into the release.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A RISC Zero proof names a guest image; it does not name the source that produced it. This
      # record is what lets a third party tie the released source to the deployed imageId.
      - name: Generate compute-provider provenance manifest
        run: |
          pnpm provenance:manifest --out compute-provider-provenance.json
          # `complete: false` means a field could not be resolved. Publishing it would put a
          # partial record beside the release as though it were a verification.
          if ! node -e "process.exit(require('./compute-provider-provenance.json').complete ? 0 : 1)"; then
            echo "provenance manifest is incomplete; refusing to publish it" >&2
            node -e "console.error(require('./compute-provider-provenance.json').unresolved.join('\n'))"
            exit 1
          fi

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find dist/ -name "*.tar.gz" -exec cp {} release-assets/ \;
          cp compute-provider-provenance.json release-assets/
          # `interfold config check` fetches this asset from the latest release,
          # so a release without it leaves operators unable to detect a redeploy.
          if [ ! -f deployments/manifest.json ]; then
            echo "deployments/manifest.json is missing. Run \`pnpm gen:manifest\` and commit it." >&2
            exit 1
          fi
          cp deployments/manifest.json release-assets/
          ls -la release-assets/

      - name: Generate Release Notes
        id: release_notes
        run: |
          VERSION=${{ needs.validate-and-prepare.outputs.version }}
          IS_PRERELEASE=${{ needs.validate-and-prepare.outputs.is_prerelease }}

          # Create release notes
          cat > release_notes.md << EOF
          ## 🚀 Release v${VERSION}

          EOF

          # Add pre-release warning if applicable
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            cat >> release_notes.md << EOF
          > ⚠️ **This is a pre-release version**
          > Pre-release versions may contain bugs and breaking changes.

          EOF
          fi

          # Extract changelog section for this version if CHANGELOG.md exists
          if [ -f CHANGELOG.md ]; then
            echo "### What's Changed" >> release_notes.md
            echo "" >> release_notes.md

            # auto-changelog writes headings as "#### [v0.8.0](compare-url)", so the
            # leading "v" must be optional. VERSION has it stripped from the tag, and
            # matching the bare version produced an empty "What's Changed" section.
            VERSION_RE="${VERSION//./\\.}"
            awk -v ver="${VERSION_RE}" '
              BEGIN {
                start = "^#+ \\[?v?" ver "\\]?"
                next_version = "^#+ \\[?v?[0-9]+\\.[0-9]+\\.[0-9]+"
              }
              !flag && $0 ~ start { flag = 1; next }
              flag && $0 ~ next_version { exit }
              flag { print }
            ' CHANGELOG.md > changelog_section.md

            # awk exits 0 on no match, so an empty section never reached the old
            # `||` fallback. Test the output instead of the exit status.
            if [ -s changelog_section.md ]; then
              cat changelog_section.md >> release_notes.md
            else
              echo "::warning::No CHANGELOG.md section matched v${VERSION}"
              echo "See CHANGELOG.md for details." >> release_notes.md
            fi
            rm -f changelog_section.md
          fi

          # Add installation instructions
          cat >> release_notes.md << EOF

          ---

          ## 📦 Installation

          ### Install via interfoldup (Recommended)

          Install the installer:
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/gnosisguild/interfold/main/install | bash
          \`\`\`

          Then use it to install interfold:
          \`\`\`bash
          interfoldup install
          \`\`\`

          ### NPM Packages

          EOF

          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            cat >> release_notes.md << EOF
          \`\`\`bash
          # Install pre-release versions
          npm install @interfold/sdk@next
          npm install @interfold/contracts@next
          npm install @interfold/config@next
          npm install @interfold/react@next
          \`\`\`
          EOF
          else
            cat >> release_notes.md << EOF
          \`\`\`bash
          # Install stable versions
          npm install @interfold/sdk@latest
          npm install @interfold/contracts@latest
          npm install @interfold/config@latest
          npm install @interfold/react@latest
          \`\`\`
          EOF
          fi

          # Add Rust crates section only for stable releases
          if [[ "${IS_PRERELEASE}" == "false" ]]; then
            cat >> release_notes.md << EOF

          ### Rust Crates

          \`\`\`toml
          [dependencies]
          interfold = "${VERSION}"
          \`\`\`
          EOF
          fi

          # Add binary assets information
          cat >> release_notes.md << EOF

          ## 💾 Binary Assets

          - \`interfold-*\`: The main Interfold CLI binary
          - \`interfoldup-*\`: The installer/version manager binary

          ### Supported Platforms
          - Linux (x86_64)
          - macOS (x86_64, aarch64 Apple Silicon)

          ## 📝 Checksums

          \`\`\`
          EOF

          # Generate checksums for the binaries
          cd release-assets && sha256sum *.tar.gz >> ../release_notes.md || true
          cd ..

          echo '```' >> release_notes.md

          if [[ "${{ needs.download-circuits.outputs.found }}" == "true" ]]; then
            cat >> release_notes.md << EOF

          ## 🔮 Noir Circuits

          Source hash: \`${{ needs.download-circuits.outputs.source_hash }}\`
          EOF
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate-and-prepare.outputs.version }}
          name: v${{ needs.validate-and-prepare.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.validate-and-prepare.outputs.is_prerelease }}
          generate_release_notes: false # We're providing our own
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update stable tag (for stable releases only)
        if: needs.validate-and-prepare.outputs.is_prerelease == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f stable
          # Through a credential helper, so the token never reaches a process argument list. Every
          # process on a runner shares one user, so anything left running by `pnpm install` can read
          # /proc/*/cmdline; it cannot read another process's environment as easily. The config
          # stores the helper only — the token is read from the environment when git invokes it.
          git config --local credential.helper '!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f'
          git push origin stable --force
          git config --local --unset credential.helper
          echo "✅ Updated 'stable' tag to point to v${{ needs.validate-and-prepare.outputs.version }}"
